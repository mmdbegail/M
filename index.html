<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تأیید کاربر</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #0b1020;
      color: #f5f7ff;
      font-family: Tahoma, Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 430px;
      padding: 30px;
      border: 1px solid #303b58;
      border-radius: 24px;
      background: #151d31;
      text-align: center;
      box-shadow: 0 20px 70px #0005;
    }
    h1 {
      font-size: 23px;
      margin-top: 0;
    }
    p {
      color: #bdc7dd;
      font-size: 14px;
      line-height: 2;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      background: #7865ff;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }
    button.secondary {
      background: #293550;
    }
    video, canvas, img {
      width: 100%;
      margin-top: 15px;
      border-radius: 12px;
    }
    [hidden] {
      display: none !important;
    }
    #status {
      margin-top: 15px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>تأیید کاربر</h1>
    <p>
      برای ادامه، تأیید کنید که یک کاربر واقعی هستید.
      با انتخاب دکمه زیر، مرورگر برای دسترسی به دوربین سلفی
      از شما اجازه می‌گیرد. پس از ثبت عکس، تصویر نمایش داده
      می‌شود و فقط در صورت تأیید شما به مدیر سایت در تلگرام
      ارسال خواهد شد.
    </p>
    <button id="start">من ربات نیستم</button>
    <section id="cameraSection" hidden>
      <video id="video" autoplay playsinline></video>
      <button id="capture">گرفتن عکس</button>
    </section>
    <section id="previewSection" hidden>
      <canvas id="canvas" hidden></canvas>
      <img id="preview" alt="پیش‌نمایش عکس">
      <p>آیا مایلید این عکس برای مدیر سایت ارسال شود؟</p>
      <button id="send">تأیید و ارسال عکس</button>
      <button id="retake" class="secondary">گرفتن عکس مجدد</button>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const startButton = document.getElementById("start");
    const cameraSection = document.getElementById("cameraSection");
    const previewSection = document.getElementById("previewSection");
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const preview = document.getElementById("preview");
    const status = document.getElementById("status");
    const captureButton = document.getElementById("capture");
    const sendButton = document.getElementById("send");
    const retakeButton = document.getElementById("retake");
    let stream = null;
    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      video.srcObject = null;
    }
    startButton.addEventListener("click", async () => {
      if (!navigator.mediaDevices?.getUserMedia) {
        status.textContent =
          "دوربین در دسترس نیست. از مرورگر به‌روز و اتصال HTTPS استفاده کنید.";
        return;
      }
      startButton.disabled = true;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: "user"
          }
        });
        video.srcObject = stream;
        cameraSection.hidden = false;
        startButton.hidden = true;
        status.textContent =
          "دوربین فعال شد. برای ثبت عکس دکمه زیر را بزنید.";
      } catch (error) {
        status.textContent =
          "دسترسی به دوربین داده نشد یا دوربین در دسترس نیست.";
        startButton.disabled = false;
      }
    });
    captureButton.addEventListener("click", () => {
      if (!video.videoWidth || !video.videoHeight) {
        status.textContent = "دوربین هنوز آماده نیست.";
        return;
      }
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const context = canvas.getContext("2d");
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      preview.src = canvas.toDataURL("image/jpeg", 0.85);
      stopCamera();
      cameraSection.hidden = true;
      previewSection.hidden = false;
      status.textContent = "عکس ثبت شد. می‌توانید آن را بررسی کنید.";
    });
    retakeButton.addEventListener("click", async () => {
      previewSection.hidden = true;
      startButton.hidden = false;
      startButton.disabled = false;
      startButton.click();
    });
    sendButton.addEventListener("click", async () => {
      sendButton.disabled = true;
      status.textContent = "در حال ارسال عکس...";
      try {
        const blob = await new Promise(resolve =>
          canvas.toBlob(resolve, "image/jpeg", 0.85)
        );
        if (!blob) {
          throw new Error("امکان آماده‌سازی تصویر وجود ندارد.");
        }
        const form = new FormData();
        form.append("photo", blob, "photo.jpg");
        const response = await fetch("/api/photo", {
          method: "POST",
          body: form
        });
        if (!response.ok) {
          throw new Error("ارسال عکس ناموفق بود.");
        }
        status.textContent = "عکس با موفقیت ارسال شد.";
        setTimeout(() => {
          window.location.replace("https://www.google.com/");
        }, 1000);
      } catch (error) {
        status.textContent = error.message;
        sendButton.disabled = false;
      }
    });
    window.addEventListener("pagehide", stopCamera);
  </script>
</body>
</html>
